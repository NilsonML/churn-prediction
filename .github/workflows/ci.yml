# Проверки на каждый push и pull request: линтер, тесты и быстрый прогон всего пайплайна.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Smoke run of the full pipeline (all models, small data)
        run: python main.py --n-samples 5000 --folds 2
