# Настройки инструментов. Зависимости проекта — в requirements.txt / requirements-dev.txt.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W — стиль (PEP 8), F — реальные ошибки, I — порядок импортов, B — частые баги
select = ["E", "W", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # чтобы тесты импортировали config и src без установки пакета
